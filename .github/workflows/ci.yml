name: Construction et tests

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Restaurer les paquets .NET
        run: dotnet restore BorneChauffeur.slnx

      - name: Compiler (avec SQL Server)
        run: dotnet build BorneChauffeur.slnx -c Release --no-restore

      - name: Tests des règles métier
        run: dotnet test tests/Dpl.Borne.Domain.Tests/Dpl.Borne.Domain.Tests.csproj -c Release --no-build --logger "trx;LogFileName=regles.trx" --results-directory resultats

      - name: Interface web
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
          npm run build:demo

      - name: Publier l'application (API + interface)
        run: |
          dotnet publish src/Dpl.Borne.Api/Dpl.Borne.Api.csproj -c Release --no-build -o publication/borne-chauffeur
          mkdir -p publication/borne-chauffeur/wwwroot
          cp -r web/dist/. publication/borne-chauffeur/wwwroot/
          cp docs/installation.md docs/compte-sql.sql publication/borne-chauffeur/
          cp web/dist-demo/index.html publication/borne-chauffeur-demo.html

      - name: Démarrage de l'API publiée (mode démonstration)
        run: |
          cd publication/borne-chauffeur
          ASPNETCORE_URLS=http://127.0.0.1:5080 dotnet Dpl.Borne.Api.dll > ../api.log 2>&1 &
          API_PID=$!
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5080/api/sante && break; sleep 1; done
          curl -fs "http://127.0.0.1:5080/api/borne?borne=SEICHAUFF01"
          curl -fs -o /dev/null "http://127.0.0.1:5080/?borne=SEICHAUFF01"
          kill $API_PID || true
          cat ../api.log

      - name: Paquet à installer sur le serveur
        uses: actions/upload-artifact@v4
        with:
          name: borne-chauffeur-${{ github.sha }}
          path: publication/borne-chauffeur
          retention-days: 30

      - name: Démonstration autonome
        uses: actions/upload-artifact@v4
        with:
          name: borne-chauffeur-demo
          path: publication/borne-chauffeur-demo.html
          retention-days: 30

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: resultats
          if-no-files-found: ignore
